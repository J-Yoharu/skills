name: External interoperability
# Network-dependent compatibility tests are explicit, not a recurring expense.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skills-interoperability
  cancel-in-progress: true
jobs:
  official-tools:
    if: vars.INTEROP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-reference.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: make bootstrap
      - run: make bootstrap-reference
      - name: Official format validator and real CLI installation
        run: make interop
