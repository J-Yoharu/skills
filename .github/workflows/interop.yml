name: External interoperability
# Network-dependent compatibility tests are explicit, not a recurring expense.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skills-interoperability
  cancel-in-progress: true
jobs:
  official-tools:
    if: vars.INTEROP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-reference.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: make bootstrap
      - run: make bootstrap-reference
      - name: Official format validator and real CLI installation
        run: make interop
